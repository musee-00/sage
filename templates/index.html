<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1e1e1e;
    color: #d4d4d4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #header {
    padding: 10px 16px;
    background: #252526;
    border-bottom: 1px solid #3e3e3e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #cccccc;
  }

  #header span { font-weight: 600; }

  #reset-btn {
    background: none;
    border: 1px solid #555;
    color: #aaa;
    padding: 3px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
  }
  #reset-btn:hover { border-color: #aaa; color: #fff; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 90%;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: #0e639c;
    color: #fff;
  }

  .msg.assistant {
    align-self: flex-start;
    background: #2d2d2d;
    border: 1px solid #3e3e3e;
  }

  .msg.thinking {
    align-self: flex-start;
    background: transparent;
    color: #888;
    font-style: italic;
    font-size: 12px;
    padding: 4px 0;
  }

  #input-area {
    padding: 12px 16px;
    background: #252526;
    border-top: 1px solid #3e3e3e;
    display: flex;
    gap: 8px;
  }

  #input {
    flex: 1;
    background: #3c3c3c;
    border: 1px solid #555;
    color: #d4d4d4;
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 13px;
    resize: none;
    height: 38px;
    max-height: 120px;
    overflow-y: auto;
    font-family: inherit;
    outline: none;
  }
  #input:focus { border-color: #0e639c; }

  #send-btn {
    background: #0e639c;
    border: none;
    color: #fff;
    padding: 0 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
  }
  #send-btn:hover { background: #1177bb; }
  #send-btn:disabled { background: #555; cursor: default; }
</style>
</head>
<body>

<div id="header">
  <span>🌿 Sage</span>
  <button id="reset-btn" onclick="resetChat()">Ny chatt</button>
</div>

<div id="messages"></div>

<div id="input-area">
  <textarea id="input" placeholder="Skriv ett meddelande..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">&#9650;</button>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    inputEl.value = '';
    inputEl.style.height = '38px';
    addMessage(text, 'user');

    sendBtn.disabled = true;
    const thinking = addMessage('Tänker...', 'thinking');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      thinking.remove();
      addMessage(data.response, 'assistant');
    } catch (e) {
      thinking.remove();
      addMessage('Fel: kunde inte nå servern.', 'assistant');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetChat() {
    await fetch('/reset', { method: 'POST' });
    messagesEl.innerHTML = '';
    addMessage('Ny chatt startad. Hur kan jag hjälpa dig?', 'assistant');
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = '38px';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  addMessage('Hej! Jag är din AI-kodassistent. Jag kan läsa/skriva filer, köra kommandon och söka i kod. Hur kan jag hjälpa dig?', 'assistant');
</script>
</body>
</html>
